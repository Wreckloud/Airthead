name: Deploy to CloudBase Static Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase CLI
        run: tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}

      - name: Prepare deploy folders
        run: |
          mkdir -p deploy-site deploy-posts
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            --exclude node_modules \
            --exclude deploy-site \
            --exclude deploy-posts \
            --exclude posts \
            ./ deploy-site/
          rsync -a --delete ./posts/ deploy-posts/

      - name: Deploy (with retry)
        run: |
          set -euo pipefail
          retry() {
            local max=3
            local n=1
            local delay=5
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                return 1
              fi
              echo "Retry $n/$max failed. Sleeping ${delay}s..."
              n=$((n + 1))
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          retry tcb hosting deploy ./deploy-site / -e "${{ secrets.TCB_ENV_ID }}"
          retry tcb hosting deploy ./deploy-posts /posts -e "${{ secrets.TCB_ENV_ID }}"
