<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章 · Airthead</title>
    <link rel="stylesheet" href="../../assets/styles/base.css" />
    <link rel="stylesheet" href="../../assets/styles/common.css" />
    <style>
      /* 返回链接 */
      .back-link {
        display: inline-flex;
        align-items: center;
        font-size: 13px;
        color: var(--sage);
        letter-spacing: 0.2em;
        margin-bottom: 12px;
      }

      /* 文章整体布局 */
      .article {
        display: grid;
        gap: 20px;
        margin-top: 16px;
      }

      /* 标题区 */
      .article-header {
        padding: 24px;
      }

      /* 标题 */
      .article-header h1 {
        margin: 0 0 8px;
        font-family: "Optima", "Candara", "Trebuchet MS", sans-serif;
        font-size: clamp(26px, 3vw, 40px);
      }

      /* 摘要 */
      .article-header p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }

      /* 时间等元信息 */
      .article-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 14px;
        color: var(--sage);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }

      /* 图片区（支持多图） */
      .article-hero {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      /* 图片默认显示 */
      .article-hero img {
        width: 100%;
        height: auto;
      }

      /* 长图收窄显示 */
      .article-hero img.is-tall {
        width: min(100%, 520px);
        margin: 0 auto;
      }

      /* 正文容器 */
      .article-content {
        display: grid;
        gap: 18px;
        padding: 24px;
      }

      /* 正文段落 */
      .article-section {
        display: grid;
        gap: 12px;
      }

      .article-section p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      /* 空状态 */
      .not-found {
        padding: 18px;
        color: var(--muted);
      }

      /* 小屏优化 */
      @media (max-width: 720px) {
        .article-header {
          padding: 18px;
        }

        .article-content {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <div class="brand">Airthead Notes</div>
        <div class="nav-links">
          <a href="../about/">关于</a>
        </div>
      </nav>

      <a class="back-link" href="../home/">返回列表</a>

      <article class="article" data-article>
        <header class="article-header">
          <h1 data-post-title></h1>
          <p data-post-summary></p>
          <div class="article-meta" data-post-meta></div>
          <div class="tag-row" data-post-tags></div>
        </header>

        <div class="article-hero" data-post-hero></div>

        <div class="article-content" data-post-content></div>
      </article>
    </div>

    <script src="../../posts/posts.js"></script>
    <script src="post.js"></script>
  </body>
</html>
